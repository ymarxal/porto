<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <rect width="1200" height="800" fill="#FAF9F6"/>
  <rect x="100" y="80" width="1000" height="640" fill="#FFFFFF" rx="8" stroke="#E5E5E0" stroke-width="2"/>
  
  <!-- Editorial Grid Lines -->
  <g stroke="#111111" opacity="0.08" stroke-width="1">
    <line x1="100" y1="200" x2="1100" y2="200"/>
    <line x1="100" y1="400" x2="1100" y2="400"/>
    <line x1="100" y1="600" x2="1100" y2="600"/>
    <line x1="450" y1="80" x2="450" y2="720"/>
    <line x1="800" y1="80" x2="800" y2="720"/>
  </g>

  <!-- Swiss Logo Mark -->
  <g transform="translate(160, 140)">
    <rect x="0" y="0" width="120" height="120" fill="#111111"/>
    <circle cx="60" cy="60" r="36" fill="#FAF9F6"/>
    <rect x="42" y="42" width="36" height="36" fill="#111111"/>
    <text x="160" y="75" fill="#111111" font-family="'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="4">AETHERIA</text>
    <text x="160" y="105" fill="#666666" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" letter-spacing="6">ARCHITECTURAL STUDIO</text>
  </g>

  <!-- Typography & Color Palette Mockup -->
  <g transform="translate(160, 320)">
    <text x="0" y="30" fill="#111111" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700">01 / BRAND COLOR MATRIX</text>
    
    <rect x="0" y="60" width="100" height="140" fill="#111111" rx="4"/>
    <text x="10" y="185" fill="#FFFFFF" font-family="monospace" font-size="11">#111111</text>

    <rect x="115" y="60" width="100" height="140" fill="#F59E0B" rx="4"/>
    <text x="125" y="185" fill="#FFFFFF" font-family="monospace" font-size="11">#F59E0B</text>

    <rect x="230" y="60" width="100" height="140" fill="#E5E5E0" rx="4"/>
    <text x="240" y="185" fill="#111111" font-family="monospace" font-size="11">#E5E5E0</text>
  </g>

  <!-- Business Card Presentation -->
  <g transform="translate(520, 320)">
    <rect x="0" y="0" width="480" height="280" rx="12" fill="#111111"/>
    <text x="50" y="80" fill="#FAF9F6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="3">AETHERIA</text>
    <text x="50" y="110" fill="#F59E0B" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="4">IDENTITY SYSTEM 2025</text>

    <text x="50" y="200" fill="#A3A3A3" font-family="monospace" font-size="13">ZÜRICH • TOKYO • NEW YORK</text>
    <text x="50" y="225" fill="#FAF9F6" font-family="monospace" font-size="13">info@aetheria-arch.com</text>
  </g>
</svg>
