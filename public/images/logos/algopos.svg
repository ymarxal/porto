<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="algoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eee642" />
      <stop offset="100%" stop-color="#c4bc14" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#eee642" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#darkBg)" stroke="#262626" stroke-width="3" />

  <!-- Outer Geometric Circuit Frame -->
  <path d="M 60 42 L 140 42 C 152 42, 160 50, 160 62 L 160 138 C 160 150, 152 158, 140 158 L 60 158 C 48 158, 40 150, 40 138 L 40 62 C 40 50, 48 42, 60 42 Z" fill="none" stroke="#222" stroke-width="4" stroke-dasharray="8 6" />

  <!-- Modern Geometric 'A' + Cafe Cup + Algo Nodes -->
  <g filter="url(#glow)">
    <!-- Apex Node -->
    <circle cx="100" cy="50" r="7" fill="url(#algoGrad)" />

    <!-- Left Leg Node & Path -->
    <path d="M 100 50 L 64 136" stroke="url(#algoGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="64" cy="136" r="7" fill="url(#algoGrad)" />

    <!-- Right Leg Node & Path -->
    <path d="M 100 50 L 136 136" stroke="url(#algoGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="136" cy="136" r="7" fill="url(#algoGrad)" />

    <!-- Crossbar / POS Barcode Scanner Beam -->
    <path d="M 76 102 L 124 102" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
    
    <!-- Central Digital Coffee Steam / Algorithm Core Node -->
    <circle cx="100" cy="84" r="5" fill="#ffffff" />
    <circle cx="100" cy="102" r="6" fill="#eee642" />

    <!-- Bottom Pulse Data Wave -->
    <path d="M 88 148 L 100 142 L 112 148" fill="none" stroke="#eee642" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  </g>
</svg>
