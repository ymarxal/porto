<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#0C0D14"/>
  <defs>
    <linearGradient id="aff-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="aff-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E100FF"/>
      <stop offset="100%" stop-color="#7B00FF"/>
    </linearGradient>
    <linearGradient id="aff-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <linearGradient id="aff-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFCC"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
  </defs>
  <!-- Affinity Official Geometric Suite Polygon Delta Logo -->
  <g transform="translate(256, 256) scale(1.05) translate(-256, -256)">
    <!-- Top Left to Center -->
    <path d="M256 74 L104 336 L208 336 L256 250 Z" fill="url(#aff-cyan)"/>
    <!-- Top Right to Center -->
    <path d="M256 74 L256 250 L304 336 L408 336 Z" fill="url(#aff-blue)"/>
    <!-- Center Inset Delta -->
    <path d="M256 160 L188 280 L324 280 Z" fill="#0C0D14"/>
    <!-- Bottom Wings / Horizontal Connectors -->
    <path d="M104 336 L156 426 L256 426 L208 336 Z" fill="url(#aff-purple)"/>
    <path d="M408 336 L304 336 L256 426 L356 426 Z" fill="url(#aff-orange)"/>
    <!-- Center Core Crystal -->
    <polygon points="256,250 208,336 304,336" fill="#FFFFFF" opacity="0.15"/>
    <polygon points="208,336 256,426 304,336" fill="#7B00FF" opacity="0.4"/>
  </g>
</svg>