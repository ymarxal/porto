<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <rect width="1200" height="800" fill="#18181B"/>
  <rect x="100" y="80" width="1000" height="640" fill="#09090B" rx="8" stroke="#3F3F46" stroke-width="1.5"/>

  <g transform="translate(160, 160)">
    <text x="0" y="40" fill="#71717A" font-family="monospace" font-size="14" letter-spacing="4">ISSUE 08 / SWISS ARCHITECTURE</text>
    <text x="0" y="120" fill="#FFFFFF" font-family="'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">MONOLITH</text>
    
    <text x="0" y="180" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="20">A celebration of concrete forms, typography rules, and spatial minimalist art.</text>

    <!-- Photo Collage -->
    <rect x="0" y="240" width="380" height="260" fill="#27272A"/>
    <text x="190" y="375" fill="#71717A" font-family="monospace" font-size="14" text-anchor="middle">FIG 1. BRUTALIST GRID</text>

    <rect x="420" y="240" width="460" height="260" fill="#3F3F46"/>
    <text x="650" y="375" fill="#A1A1AA" font-family="monospace" font-size="14" text-anchor="middle">FIG 2. MONOCHROME SHADOWS</text>
  </g>
</svg>
