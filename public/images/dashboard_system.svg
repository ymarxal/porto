<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="emeraldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#dbBg)"/>

  <!-- Main Dashboard Card -->
  <rect x="60" y="60" width="1080" height="680" rx="16" fill="#1E293B" opacity="0.6" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="60" y="60" width="1080" height="70" rx="16" fill="#0F172A" opacity="0.8"/>
  <text x="100" y="102" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="20" font-weight="700">APEX ANALYTICS PRO</text>
  <rect x="300" y="82" width="180" height="34" rx="8" fill="#1E293B"/>
  <text x="320" y="104" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">🔍 Search metrics...</text>

  <!-- Status Pill -->
  <rect x="940" y="80" width="160" height="36" rx="18" fill="url(#emeraldBadge)"/>
  <text x="1020" y="103" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">● Live Syncing</text>

  <!-- Metric Cards Row -->
  <g transform="translate(100, 160)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="300" height="130" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="36" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">TOTAL REVENUE (ARR)</text>
    <text x="24" y="78" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="32" font-weight="800">$2,480,920</text>
    <text x="24" y="108" fill="#10B981" font-family="system-ui, sans-serif" font-size="13" font-weight="600">↑ 18.4% vs last month</text>

    <!-- Card 2 -->
    <rect x="340" y="0" width="300" height="130" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="364" y="36" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ACTIVE USERS</text>
    <text x="364" y="78" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="32" font-weight="800">142,850</text>
    <text x="364" y="108" fill="#10B981" font-family="system-ui, sans-serif" font-size="13" font-weight="600">↑ 12.1% growth</text>

    <!-- Card 3 -->
    <rect x="680" y="0" width="320" height="130" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="704" y="36" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">CONVERSION RATE</text>
    <text x="704" y="78" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="32" font-weight="800">4.85%</text>
    <text x="704" y="108" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Optimal target met</text>
  </g>

  <!-- Big Chart Section -->
  <g transform="translate(100, 320)">
    <rect x="0" y="0" width="1000" height="380" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="30" y="45" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Real-Time Performance Pipeline</text>

    <!-- Chart Fill Area -->
    <path d="M 50 300 Q 200 240, 350 260 T 650 140 T 950 80 L 950 320 L 50 320 Z" fill="url(#chartGrad)"/>
    <!-- Chart Stroke Line -->
    <path d="M 50 300 Q 200 240, 350 260 T 650 140 T 950 80" fill="none" stroke="#10B981" stroke-width="4"/>

    <!-- Chart Nodes -->
    <circle cx="350" cy="260" r="6" fill="#10B981"/>
    <circle cx="650" cy="140" r="6" fill="#10B981"/>
    <circle cx="950" cy="80" r="8" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
  </g>
</svg>
