<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="artBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#artBg)"/>

  <!-- Node Workspace UI Mockup -->
  <rect x="80" y="80" width="1040" height="640" rx="16" fill="#0F172A" opacity="0.7" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Floating Node Canvas -->
  <g transform="translate(140, 140)">
    <!-- Node 1 -->
    <rect x="40" y="60" width="220" height="120" rx="12" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="2"/>
    <text x="60" y="100" fill="#C084FC" font-family="system-ui, sans-serif" font-size="16" font-weight="700">WebGL Shader Gen</text>
    <text x="60" y="130" fill="#94A3B8" font-family="monospace" font-size="12">Output: Vector4</text>

    <!-- Node 2 -->
    <rect x="360" y="220" width="240" height="140" rx="12" fill="#1E1B4B" stroke="#A855F7" stroke-width="2"/>
    <text x="380" y="260" fill="#F472B6" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Procedural Noise 3D</text>
    <text x="380" y="290" fill="#94A3B8" font-family="monospace" font-size="12">Frequency: 2.45 Hz</text>

    <!-- Node Bezier Wires -->
    <path d="M 260 120 C 310 120, 310 290, 360 290" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="4 4"/>

    <!-- 3D Art Output Viewport Box -->
    <rect x="650" y="40" width="310" height="440" rx="16" fill="#020617" stroke="#334155" stroke-width="1"/>
    
    <g transform="translate(805, 260)">
      <circle cx="0" cy="0" r="100" fill="url(#purpleGlow)" opacity="0.8"/>
      <polygon points="-60,-40 60,-80 80,60 -40,80" fill="#E879F9" opacity="0.5"/>
    </g>
    
    <text x="805" y="440" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">LIVE CANVAS VIEWPORT</text>
  </g>
</svg>
