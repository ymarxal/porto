<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="250" cy="200" r="220" fill="#2563EB" opacity="0.3" filter="url(#blurGlow)"/>
  <circle cx="950" cy="600" r="260" fill="#06B6D4" opacity="0.25" filter="url(#blurGlow)"/>

  <!-- Grid Patterns -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="1">
    <path d="M 0 100 H 1200 M 0 200 H 1200 M 0 300 H 1200 M 0 400 H 1200 M 0 500 H 1200 M 0 600 H 1200 M 0 700 H 1200"/>
    <path d="M 100 0 V 800 M 200 0 V 800 M 300 0 V 800 M 400 0 V 800 M 500 0 V 800 M 600 0 V 800 M 700 0 V 800 M 800 0 V 800 M 900 0 V 800 M 1000 0 V 800 M 1100 0 V 800"/>
  </g>

  <!-- UI Window Container -->
  <rect x="80" y="80" width="1040" height="640" rx="20" fill="url(#glassCard)" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <rect x="80" y="80" width="1040" height="50" rx="20" fill="#0F172A" opacity="0.6"/>
  <circle cx="120" cy="105" r="7" fill="#EF4444"/>
  <circle cx="142" cy="105" r="7" fill="#F59E0B"/>
  <circle cx="164" cy="105" r="7" fill="#10B981"/>
  
  <text x="600" y="111" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">sakok-playground.app — Live Multiplayer Session</text>

  <!-- Main Canvas Playground UI -->
  <g transform="translate(120, 160)">
    <!-- Sidebar Controls -->
    <rect x="0" y="0" width="200" height="520" rx="14" fill="#1E293B" opacity="0.7" stroke="#334155" stroke-width="1"/>
    <text x="24" y="40" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="700">TOOLS</text>

    <!-- Tool Items -->
    <rect x="20" y="65" width="160" height="42" rx="10" fill="url(#blueGlow)"/>
    <text x="60" y="91" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Select & Drag</text>
    
    <rect x="20" y="120" width="160" height="42" rx="10" fill="#334155" opacity="0.5"/>
    <text x="60" y="146" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Brush Tool</text>

    <rect x="20" y="175" width="160" height="42" rx="10" fill="#334155" opacity="0.5"/>
    <text x="60" y="201" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Vector Nodes</text>

    <!-- Active Players Box -->
    <rect x="20" y="380" width="160" height="120" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="34" y="408" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">LIVE PLAYERS (4)</text>
    <circle cx="44" cy="435" r="12" fill="#2563EB"/>
    <text x="66" y="440" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="13">You (Host)</text>
    <circle cx="44" cy="470" r="12" fill="#06B6D4"/>
    <text x="66" y="475" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="13">Alex_Dev</text>

    <!-- Main Canvas Interactive Area -->
    <rect x="230" y="0" width="730" height="520" rx="14" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Floating Graphics Nodes -->
    <rect x="300" y="60" width="220" height="140" rx="16" fill="url(#glassCard)" stroke="#38BDF8" stroke-width="2"/>
    <text x="320" y="100" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Interactive Node 01</text>
    <text x="320" y="130" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">Physics Matrix: Active</text>

    <rect x="580" y="200" width="260" height="180" rx="16" fill="url(#glassCard)" stroke="#818CF8" stroke-width="2"/>
    <text x="605" y="245" fill="#818CF8" font-family="system-ui, sans-serif" font-size="18" font-weight="700">WebGL Shader Engine</text>
    <text x="605" y="275" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">60 FPS • Sub-16ms sync</text>
    
    <!-- Connection Curve Line -->
    <path d="M 520 130 C 580 130, 520 290, 580 290" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6 6"/>

    <!-- Player Cursors -->
    <g transform="translate(480, 240)">
      <polygon points="0,0 20,15 12,18 18,30 13,32 7,20 0,25" fill="#06B6D4"/>
      <rect x="18" y="22" width="70" height="24" rx="6" fill="#06B6D4"/>
      <text x="25" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Alex_Dev</text>
    </g>

    <g transform="translate(720, 100)">
      <polygon points="0,0 20,15 12,18 18,30 13,32 7,20 0,25" fill="#EC4899"/>
      <rect x="18" y="22" width="70" height="24" rx="6" fill="#EC4899"/>
      <text x="25" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Sarah_UX</text>
    </g>
  </g>
</svg>
